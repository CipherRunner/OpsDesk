spring:
  application:
    name: opsdesk

  datasource:
    url: jdbc:postgresql://localhost:5432/opsdesk
    username: opsdesk
    password: opsdesk
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

opsdesk:
  security:
    jwt:
      # Local development only. Never reuse this value outside the dev profile.
      secret: ${OPS_DESK_JWT_SECRET:dev-only-change-this-jwt-secret-for-opsdesk-local}
